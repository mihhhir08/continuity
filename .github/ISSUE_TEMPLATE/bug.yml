name: Bug
description: Report reproducible incorrect behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimal commands, fixtures, and environment details without secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include sanitized logs or outputs.
    validations:
      required: false
  - type: dropdown
    id: security
    attributes:
      label: Security impact
      options:
        - None known
        - Possible security or privacy impact
        - Confirmed security or privacy impact
    validations:
      required: true
